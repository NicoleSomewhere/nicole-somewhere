<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="100" y="100" font-size="32" fill="#d8bc8c">内容营销 / 2025.08—2025.12</text><text x="100" y="220" font-size="66" font-weight="bold" fill="#ffe1ad">内容策略与数据分析</text><text x="100" y="300" font-size="34" fill="#bfaace">交付数据 · 客户审核 · 品类表现</text><path d="M100 345H1820" stroke="#715b7a" stroke-width="2"/><text x="100" y="430" font-size="43" fill="#fff3df">结合历史交付数据、客户审核结果及各品类内容表现，分析素材通过情况和制作</text><text x="100" y="498" font-size="43" fill="#fff3df">难点。</text><text x="100" y="596" font-size="43" fill="#fff3df">针对表现较好的实拍类内容制定精细化生产策略，持续优化内容标准和交付方案</text><text x="100" y="664" font-size="43" fill="#fff3df">，提高内容与客户需求的匹配度。</text><text x="100" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · 风变科技 · 交付中心</text><text x="1690" y="1020" font-size="32" fill="#ffe1ad">04 / 08</text></g></svg>