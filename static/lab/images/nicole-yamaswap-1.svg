<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="100" y="100" font-size="32" fill="#d8bc8c">YamaSwap｜内容运营 / 2026.08–2026.09</text><text x="100" y="220" font-size="60" font-weight="bold" fill="#ffe1ad">项目介绍</text><text x="100" y="300" font-size="34" fill="#bfaace">AI 策略 · 资产组合管理</text><path d="M100 345H1820" stroke="#715b7a" stroke-width="2"/><text x="100" y="430" font-size="40" fill="#fff3df">该项目处于早期阶段，YamaSwap 是基于 Solana 和 Base</text><text x="100" y="492" font-size="40" fill="#fff3df">构建的去中心化交易基金平台，结合 AI 策略与资产组合管理。</text><text x="100" y="578" font-size="40" fill="#fff3df">负责早期项目的海外社媒内容体系搭建、品牌传播及社区互动，支持产品研发与黑客松</text><text x="100" y="640" font-size="40" fill="#fff3df">参赛阶段的对外传播。</text><text x="100" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · YamaSwap</text><text x="1690" y="1020" font-size="32" fill="#ffe1ad">01 / 08</text></g></svg>