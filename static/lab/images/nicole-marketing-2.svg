<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="100" y="100" font-size="32" fill="#d8bc8c">内容营销 / 2025.08—2025.12</text><text x="100" y="220" font-size="66" font-weight="bold" fill="#ffe1ad">内容营销策划与需求转化</text><text x="100" y="300" font-size="34" fill="#bfaace">Brief → 内容方向 → 交付</text><path d="M100 345H1820" stroke="#715b7a" stroke-width="2"/><text x="100" y="430" font-size="43" fill="#fff3df">围绕客户营销素材需求，将项目</text><text x="100" y="498" font-size="43" fill="#fff3df">Brief、品牌要求及验收标准转化为具体内容方向、制作规范和执行排期。</text><text x="100" y="596" font-size="43" fill="#fff3df">覆盖人像、果蔬、家具等多个品类，统筹素材生产、审核、修改及最终交付。</text><text x="100" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · 风变科技 · 交付中心</text><text x="1690" y="1020" font-size="32" fill="#ffe1ad">02 / 08</text></g></svg>