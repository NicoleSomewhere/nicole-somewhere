<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="85" font-size="28" fill="#d8bc8c">AI产品运营（独立站和 app 运营） / 2023.12–2025.07</text><text x="90" y="190" font-size="64" font-weight="bold" fill="#ffe1ad">内容运营 · 数据分析</text><path d="M90 235H1830" stroke="#715b7a" stroke-width="2"/><text x="90" y="325" font-size="45" font-weight="bold" fill="#ffe1ad">内容运营</text><text x="90" y="390" font-size="40" fill="#fff3df">策划站内外产品卖点文案及活动，包括站内运营位日常栏目策划，以及站外推广文案策</text><text x="90" y="452" font-size="40" fill="#fff3df">划。</text><text x="90" y="579" font-size="45" font-weight="bold" fill="#ffe1ad">数据分析</text><text x="90" y="644" font-size="40" fill="#fff3df">搭建数据看板，负责日常渠道数据埋点；周期性统计和分析产品核心数据，优化产品体</text><text x="90" y="706" font-size="40" fill="#fff3df">验和推广策略。</text><text x="90" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · 风变科技 · 产研中心</text><text x="1730" y="1020" font-size="30" fill="#ffe1ad">04 / 04</text></g></svg>