<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="85" font-size="28" fill="#d8bc8c">AI产品运营（独立站和 app 运营） / 2023.12–2025.07</text><text x="90" y="190" font-size="64" font-weight="bold" fill="#ffe1ad">商业化 · 积分体系</text><path d="M90 235H1830" stroke="#715b7a" stroke-width="2"/><text x="90" y="325" font-size="45" font-weight="bold" fill="#ffe1ad">商业化运营</text><text x="90" y="390" font-size="40" fill="#fff3df">设计导流分成的商业变现路径，配置导流链接和文案，开展商家推广，2</text><text x="90" y="452" font-size="40" fill="#fff3df">个月内实现营收 15W+。</text><text x="90" y="579" font-size="45" font-weight="bold" fill="#ffe1ad">产品积分体系</text><text x="90" y="644" font-size="40" fill="#fff3df">从 0 到 1 搭建用量积分体系，制定单次消耗积分价格；分析上游成本和用户体</text><text x="90" y="706" font-size="40" fill="#fff3df">验，结合供应链市场价格规律进行产品定价。</text><text x="90" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · 风变科技 · 产研中心</text><text x="1730" y="1020" font-size="30" fill="#ffe1ad">03 / 04</text></g></svg>