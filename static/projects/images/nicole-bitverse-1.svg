<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="85" font-size="28" fill="#d8bc8c">Bitverse｜KOL运营 / 2026.08–2026.05</text><text x="90" y="180" font-size="60" font-weight="bold" fill="#ffe1ad">项目介绍 · 核心成果</text><path d="M90 220H1830" stroke="#715b7a" stroke-width="2"/><text x="90" y="295" font-size="43" font-weight="bold" fill="#ffe1ad">项目介绍</text><text x="90" y="351" font-size="36" fill="#fff3df">该项目处于高速增长阶段，Bitverse 是面向 Memecoin</text><text x="90" y="403" font-size="36" fill="#fff3df">投资者的链上交易平台。负责 Telegram 生态渠道拓展、KOL</text><text x="90" y="455" font-size="36" fill="#fff3df">合作及内容活动转化，支持项目增长。</text><text x="90" y="549" font-size="43" font-weight="bold" fill="#ffe1ad">核心成果</text><text x="90" y="605" font-size="36" fill="#fff3df">累计拓展 300+ TG 群组及频道，群均规模 2,000+。</text><text x="90" y="669" font-size="36" fill="#fff3df">促成 60+ 群主及 KOL 合作，KOL 渠道贡献项目 30% 注册量，项目日均注册</text><text x="90" y="721" font-size="36" fill="#fff3df">30+。</text><text x="90" y="785" font-size="36" fill="#fff3df">累计执行 16 场直播及社区活动，带动 26+ 用户交易，累计交易量 22 万+</text><text x="90" y="837" font-size="36" fill="#fff3df">USDT。</text><text x="90" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · Bitverse · KOL运营</text><text x="1730" y="1020" font-size="30" fill="#ffe1ad">01 / 04</text></g></svg>