<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="85" font-size="28" fill="#d8bc8c">AI产品运营（独立站和 app 运营） / 2023.12–2025.07</text><text x="90" y="190" font-size="64" font-weight="bold" fill="#ffe1ad">产品推广 · 应用商店</text><path d="M90 235H1830" stroke="#715b7a" stroke-width="2"/><text x="90" y="325" font-size="45" font-weight="bold" fill="#ffe1ad">产品推广</text><text x="90" y="390" font-size="40" fill="#fff3df">制定并执行产品推广策略，包括卖点包装、渠道布局、推广内容策划及引流路径设计。</text><text x="90" y="452" font-size="40" fill="#fff3df">覆盖公域新媒体、私域、站外渠道合作、直播等，合计新增用户</text><text x="90" y="514" font-size="40" fill="#fff3df">10W+，独立站单日 UV 36W+。</text><text x="90" y="641" font-size="45" font-weight="bold" fill="#ffe1ad">应用商店运营</text><text x="90" y="706" font-size="40" fill="#fff3df">负责 App 上架文案及日常 ASO，优化排名；建立 App Q&amp;A</text><text x="90" y="768" font-size="40" fill="#fff3df">问答库，通过流程管理和话术引导，梳理并优化用户下载和使用路径。</text><text x="90" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · 风变科技 · 产研中心</text><text x="1730" y="1020" font-size="30" fill="#ffe1ad">02 / 04</text></g></svg>