<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#241d32"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="85" font-size="28" fill="#d8bc8c">Bitverse｜KOL运营 / 2026.08–2026.05</text><text x="90" y="180" font-size="60" font-weight="bold" fill="#ffe1ad">商务合作 · 内容策划</text><path d="M90 220H1830" stroke="#715b7a" stroke-width="2"/><text x="90" y="295" font-size="43" font-weight="bold" fill="#ffe1ad">商务沟通与合作推进</text><text x="90" y="351" font-size="36" fill="#fff3df">独立负责 KOL 建联、商务谈判、合作执行及复盘；设计并落地 CPS／CPA</text><text x="90" y="403" font-size="36" fill="#fff3df">激励方案，明确合作规则与转化指标，标准化对接话术及推广内容包，推动合作落地。</text><text x="90" y="497" font-size="43" font-weight="bold" fill="#ffe1ad">内容策划与项目管理</text><text x="90" y="553" font-size="36" fill="#fff3df">结合 KOL 及社群调性，将产品信息转化为推广文案、活动说明及直播内容，协同准备视觉物料</text><text x="90" y="605" font-size="36" fill="#fff3df">；制定内容发布排期，跟进合作方执行，根据群组活跃节奏优化发布频率与时间。</text><text x="90" y="1020" font-size="28" fill="#bfaace">NICOLE, SOMEWHERE · Bitverse · KOL运营</text><text x="1730" y="1020" font-size="30" fill="#ffe1ad">03 / 04</text></g></svg>